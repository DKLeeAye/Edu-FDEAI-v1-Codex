services:
  postgres:
    image: postgres:16-alpine
    container_name: edufde-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-edufde}
      POSTGRES_USER: ${POSTGRES_USER:-edufde}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-edufde}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    container_name: edufde-redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-12-18T13-15-44Z
    container_name: edufde-minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edufde_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edufde_minio_password}
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data

  minio-init:
    image: minio/mc:RELEASE.2024-11-21T17-21-54Z
    container_name: edufde-minio-init
    depends_on:
      - minio
    entrypoint: >
      /bin/sh -c "
      until mc alias set local http://minio:9000 $${MINIO_ROOT_USER} $${MINIO_ROOT_PASSWORD}; do sleep 2; done;
      mc mb --ignore-existing local/$${S3_BUCKET_NAME};
      "
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-edufde_minio}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-edufde_minio_password}
      S3_BUCKET_NAME: ${S3_BUCKET_NAME:-edufde-local}
    restart: "no"

volumes:
  postgres_data:
  redis_data:
  minio_data:
